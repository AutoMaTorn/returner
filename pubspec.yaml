name: returner
description: Returns apps removed from the App Store back to an iPhone.
publish_to: none
version: 0.1.0+1

environment:
  sdk: ^3.13.5

dependencies:
  archive: ^4.5.2
  crypto: ^3.0.7
  file_selector: ^1.1.0
  flutter:
    sdk: flutter
  flutter_riverpod: ^3.4.3
  flutter_secure_storage: ^11.2.0
  flutter_svg: ^2.3.0
  http: ^1.6.0
  logging: ^1.3.0
  path: ^1.9.1
  path_provider: ^2.1.6
  sqlite3: ^3.7.1
  url_launcher: ^6.3.3
  xml: ">=6.3.0 <8.0.0"

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  mocktail: ^1.0.5

flutter:
  uses-material-design: true
  assets:
    - assets/catalog.json
    - assets/icons/
    - assets/catalog_icons/
    - licenses/
